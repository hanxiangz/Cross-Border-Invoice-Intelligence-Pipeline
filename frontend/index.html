<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invoice Intelligence | China-Australia Trade</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { margin: 0 0 8px 0; color: #1a1a2e; }
        .subtitle { color: #666; margin-bottom: 32px; }
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }
        .upload-area:hover, .upload-area.dragover {
            background: #eef2ff;
            border-color: #764ba2;
        }
        #loading {
            display: none;
            text-align: center;
            margin: 24px 0;
            padding: 16px;
            background: #f0f0f0;
            border-radius: 12px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #result {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 16px;
        }
        .badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .field {
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }
        .field-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .field-value {
            font-size: 16px;
            color: #1a1a2e;
            font-weight: 600;
            margin-top: 4px;
            word-break: break-word;
        }
        .field-value.empty { color: #ccc; font-weight: 400; font-style: italic; }
        pre {
            background: #1e1e2e;
            color: #50fa7b;
            padding: 16px;
            border-radius: 12px;
            overflow-x: auto;
            font-size: 12px;
            margin-top: 16px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 16px;
        }
        button:hover { background: #5a67d8; }
        .collapsible-toggle {
            background: none;
            color: #667eea;
            border: none;
            padding: 0;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📄 Cross-Border Invoice Intelligence</h1>
    <div class="subtitle">China → Australia Trade Document Processor</div>

    <div class="upload-area" id="uploadArea">
        📁 Drag & drop your invoice here<br>
        <small style="color:#888">(JPG, PNG, PDF accepted)</small>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p id="loadingText">Sending to Azure AI Vision for OCR...</p>
    </div>

    <div id="result">
        <span class="badge">✅ Extraction Complete</span>
        <h3>📊 Extracted Data</h3>

        <div class="field-grid">
            <div class="field">
                <div class="field-label">Invoice Number</div>
                <div class="field-value empty" id="invoiceNumber">—</div>
            </div>
            <div class="field">
                <div class="field-label">Amount</div>
                <div class="field-value empty" id="amount">—</div>
            </div>
            <div class="field">
                <div class="field-label">File Name</div>
                <div class="field-value empty" id="fileName">—</div>
            </div>
            <div class="field">
                <div class="field-label">Processed At</div>
                <div class="field-value empty" id="processedAt">—</div>
            </div>
        </div>

        <button class="collapsible-toggle" onclick="toggleRawText()">Show raw OCR text</button>
        <pre id="rawText" style="display:none;"></pre>

        <button onclick="resetForm()">Upload Another</button>
    </div>
</div>

<!-- Load config FIRST, then the app logic -->
<script src="config.js"></script>
<script>
    // ============================================================
    // DOM REFERENCES
    // ============================================================
    const uploadArea  = document.getElementById('uploadArea');
    const loadingDiv  = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const resultDiv   = document.getElementById('result');
    const rawTextEl   = document.getElementById('rawText');

    // ============================================================
    // PULL CONFIG FROM config.js
    // ============================================================
    const { API, POLLING, UPLOAD, DISPLAY, MS_PER_SECOND } = window.APP_CONFIG;

    // ============================================================
    // UPLOAD: CLICK HANDLER
    // ============================================================
    uploadArea.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = UPLOAD.ACCEPTED_TYPES;
        input.onchange = (e) => uploadFile(e.target.files[0]);
        input.click();
    });

    // ============================================================
    // UPLOAD: DRAG AND DROP HANDLERS
    // ============================================================
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) uploadFile(file);
    });

    // ============================================================
    // MAIN UPLOAD FUNCTION
    // ============================================================
    async function uploadFile(file) {
        // Reject empty files
        if (file.size < UPLOAD.MIN_FILE_SIZE_BYTES) {
            showError('The file is empty. Please select a valid image.');
            return;
        }

        // Reject files larger than the maximum
        const maxSizeBytes = UPLOAD.MAX_FILE_SIZE_MB * UPLOAD.BYTES_PER_MB;
        if (file.size > maxSizeBytes) {
            showError(`File is too large. Max ${UPLOAD.MAX_FILE_SIZE_MB} MB.`);
            return;
        }

        loadingDiv.style.display = DISPLAY.BLOCK;
        loadingText.textContent = 'Uploading invoice...';
        resultDiv.style.display = DISPLAY.NONE;

        const reader = new FileReader();
        reader.onload = async () => {
            const base64 = reader.result.split(',')[1];
            const payload = {
                fileName: file.name,
                contentType: file.type || 'application/octet-stream',
                content: base64
            };

            try {
                const response = await fetch(API.UPLOAD, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const uploadResult = await response.json();

                if (uploadResult.success && uploadResult.blobName) {
                    loadingText.textContent = 'Running AI Vision OCR...';
                    pollForResults(uploadResult.blobName);
                } else {
                    showError('Upload succeeded but no blobName was returned.');
                }
            } catch (error) {
                showError(error.message);
            }
        };
        reader.readAsDataURL(file);
    }

    // ============================================================
    // POLL FOR OCR RESULTS
    // ============================================================
    async function pollForResults(blobName) {
        const isLastAttempt = (attempt) => attempt === POLLING.MAX_ATTEMPTS - 1;

        for (let i = 0; i < POLLING.MAX_ATTEMPTS; i++) {
            try {
                const response = await fetch(
                    `${API.GET_DATA}?fileName=${encodeURIComponent(blobName)}`
                );

                if (response.status === 200) {
                    const data = await response.json();
                    if (data.success && data.data) {
                        displayResults(data.data);
                        return;
                    }
                }
            } catch (error) {
                // Network hiccup — retry
            }

            // On the final attempt, check if the document exists with an error status
            if (isLastAttempt(i)) {
                try {
                    const response = await fetch(
                        `${API.GET_DATA}?fileName=${encodeURIComponent(blobName)}`
                    );
                    if (response.status === 200) {
                        const data = await response.json();
                        if (data.data && data.data.status === 'error') {
                            showError(`Processing failed: ${data.data.error}`);
                            return;
                        }
                    }
                } catch (error) {
                    // Ignore — fall through to the timeout error
                }
            }

            await new Promise(resolve => setTimeout(resolve, POLLING.DELAY_MS));
        }

        const timeoutSeconds = POLLING.TIMEOUT_MS / MS_PER_SECOND;
        showError(
            `Processing is taking longer than expected ` +
            `(${timeoutSeconds} seconds). Check Cosmos DB directly.`
        );
    }

    // ============================================================
    // DISPLAY RESULTS
    // ============================================================
    function displayResults(doc) {
        setField('invoiceNumber', doc.invoiceNumber);
        setField('amount', doc.amount);
        setField('fileName', doc.fileName);
        setField('processedAt', doc.processedAt
            ? new Date(doc.processedAt).toLocaleString()
            : null);

        rawTextEl.textContent = doc.extractedText || 'No text extracted';

        loadingDiv.style.display = DISPLAY.NONE;
        resultDiv.style.display = DISPLAY.BLOCK;
    }

    function setField(id, value) {
        const el = document.getElementById(id);
        const isEmpty = !value || value === 'Not found';
        el.textContent = isEmpty ? '—' : value;
        el.classList.toggle('empty', isEmpty);
    }

    // ============================================================
    // ERROR DISPLAY
    // ============================================================
    function showError(message) {
        setField('invoiceNumber', null);
        setField('amount', null);
        setField('fileName', null);
        setField('processedAt', null);
        rawTextEl.textContent = `Error: ${message}`;
        loadingDiv.style.display = DISPLAY.NONE;
        resultDiv.style.display = DISPLAY.BLOCK;
    }

    // ============================================================
    // UTILITY FUNCTIONS
    // ============================================================
    function toggleRawText() {
        const isHidden = rawTextEl.style.display === DISPLAY.NONE;
        rawTextEl.style.display = isHidden ? DISPLAY.BLOCK : DISPLAY.NONE;
    }

    function resetForm() {
        resultDiv.style.display = DISPLAY.NONE;
        loadingDiv.style.display = DISPLAY.NONE;
    }
</script>
</body>
</html>
